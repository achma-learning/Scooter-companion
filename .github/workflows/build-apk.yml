name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # This repo does not commit gradle-wrapper.jar (it's a binary fetched from
      # services.gradle.org, which the environment that generated this project could not
      # reach). This step generates a real wrapper once, in CI, where network access is
      # available. If you already have Gradle 8.7+ locally, you can instead just run
      # `gradle wrapper --gradle-version 8.7` yourself and commit the result.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
