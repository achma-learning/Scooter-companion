name: Build & release

# Every push to main (and every v* tag) publishes a GitHub Release with:
#   agility-companion.apk      — the Android app (install on the phone)
#   agility-companion-web.zip  — the website, ready to upload to any static host
# Pull requests build and test the same things and attach them as workflow artifacts.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release from this run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check knowledge base is up to date
        run: |
          python3 scripts/content/build_content.py
          git diff --exit-code shared/content/agility50.json

      - name: Fuel-price parser tests
        run: python3 -m unittest discover -s scripts/fuel

      - name: Website tests (planner + backup interop)
        run: node --test web/tests/*.test.mjs

      - name: Android unit tests (planner, backup interop, every screen renders)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Optional real signing key: add repository secrets RELEASE_KEYSTORE_BASE64,
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Without them the
      # release APK is signed with the committed sideload key (app/signing), so updates still install.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/agility-companion.apk

      - name: Build website
        run: |
          scripts/build-web.sh dist/web
          (cd dist/web && zip -qr ../../out/agility-companion-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: agility-companion
          path: out/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/web

  release:
    needs: build
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agility-companion
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: Agility Companion ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('2.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/agility-companion.apk
            out/agility-companion-web.zip
          body: |
            **Android app** — download `agility-companion.apk` on your phone and open it (allow "install unknown apps" once).
            **Website** — unzip `agility-companion-web.zip` and upload the files to any static host (GitHub Pages, Netlify…).

            Move your garage between the two with Settings → Export / Import.

  # Optional: publish the website on GitHub Pages too. Enable Pages with source
  # "GitHub Actions" (Settings → Pages), then set the repository variable DEPLOY_PAGES=true.
  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
