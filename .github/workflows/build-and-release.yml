name: Build & release

# Every push to main (and every v* tag) publishes a GitHub Release with:
#   scooter-companion.apk      — the Android app, signed with the private release key
#   agility-companion-web.zip  — the frozen Agility Companion website
# Releases need the release key (see README "Releases": one password, one click). Without it
# the run still tests everything and uploads a debug APK as a workflow artifact.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release from this run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 3.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android-app

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check knowledge base is up to date
        run: |
          python3 scripts/content/build_content.py
          git diff --exit-code shared/content/agility50.json

      - name: Fuel-price parser tests
        run: python3 -m unittest discover -s scripts/fuel

      - name: Website tests (planner + backup interop)
        run: node --test web/tests/*.test.mjs

      - name: Android unit tests (planner, backup interop, every screen renders)
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace

      # The release key, the same for every release or phones refuse the update. Two ways:
      # - usual: android-app/app/signing/release.jks.gpg, created once by the "Create release
      #   key" workflow and decrypted with the RELEASE_KEYSTORE_PASSWORD secret;
      # - advanced: your own keystore in RELEASE_KEYSTORE_BASE64 (+ RELEASE_KEY_ALIAS and
      #   RELEASE_KEY_PASSWORD when they differ from "scooter" and the keystore password).
      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ENCRYPTED=android-app/app/signing/release.jks.gpg
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          elif [ -f "$ENCRYPTED" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_PASSWORD" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt --output "$RUNNER_TEMP/release.jks" "$ENCRYPTED"
          else
            echo "::warning::No release key yet: building a debug APK only, no GitHub Release. See README \"Releases\" (one password + one click)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.key.outputs.signed == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'scooter' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          (cd android-app && ./gradlew assembleRelease --stacktrace)
          mkdir -p out
          cp android-app/app/build/outputs/apk/release/app-release.apk out/scooter-companion.apk

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        run: |
          (cd android-app && ./gradlew assembleDebug --stacktrace)
          mkdir -p out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk out/scooter-companion-debug.apk

      - name: Build website
        run: |
          scripts/build-web.sh dist/web
          (cd dist/web && zip -qr ../../out/agility-companion-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: scooter-companion
          path: out/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/web

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (github.event_name == 'push' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scooter-companion
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.{0}', github.run_number) }}
          name: Scooter Companion ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('3.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/scooter-companion.apk
            out/agility-companion-web.zip
          body: |
            **Android app**: download `scooter-companion.apk` on your phone and open it (allow "install unknown apps" once).
            Already installed? Settings → App updates → Check for updates.
            Coming from Agility Companion? Export a backup there (Settings → Export), then import it in Scooter Companion.

            **Website** (frozen, Agility Companion): unzip `agility-companion-web.zip` and upload the files to any static host.

            <!-- versionCode: ${{ github.run_number }} -->

  # Optional: publish the website on GitHub Pages too. Enable Pages with source
  # "GitHub Actions" (Settings → Pages), then set the repository variable DEPLOY_PAGES=true.
  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
