<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agility Companion</title>
  <meta name="description" content="Owner companion for the Kymco Agility 50 4T: service reminders tuned for Marrakech, digital passport, manual, troubleshooting and more. Works offline.">
  <meta name="theme-color" content="#e30613">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (no light flash in dark mode).
    try { var t = localStorage.getItem('agility-companion:theme'); if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Main">
      <div class="brand"><img src="img/icon-192.png" alt="">Agility Companion</div>
    </nav>
    <main id="view" tabindex="-1">
      <noscript><p>Agility Companion needs JavaScript.</p></noscript>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
